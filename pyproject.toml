[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-seo-geo"
version = "3.8.1"
description = "Empirical SEO & Generative Engine Optimization (GEO) Autonomous Inspection Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ezhuk1" }
]
keywords = [
    "seo",
    "geo",
    "generative-engine-optimization",
    "search-engine-optimization",
    "schema-org",
    "json-ld",
    "robots-txt",
    "rfc9309",
    "sitemap",
    "llm-search",
    "chatgpt-search",
    "perplexity"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ezhuk1/ultimate-seo-geo"
Repository = "https://github.com/Ezhuk1/ultimate-seo-geo.git"
Issues = "https://github.com/Ezhuk1/ultimate-seo-geo/issues"

[project.scripts]
ultimate-seo-geo = "engine.inspector:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "rules*", "references*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatting / prose
    "E402",  # module import not at top of file
    "E741",  # ambiguous variable name
    "F401",  # unused import
    "F841",  # unused variable
    "B008",  # do not perform function calls in argument defaults
    "B028",  # no explicit stacklevel
    "B905",  # zip without strict
    "UP006", # non-pep585-annotation (typing.Dict/List)
    "UP007", # non-pep604-annotation (Optional/Union)
    "UP015", # redundant open modes
    "UP035", # deprecated imports
    "UP037", # quoted annotation
    "UP038", # non-pep604-isinstance
    "W293",  # blank line with whitespace
]


