name: Bug Report
description: Report an issue or false positive in SEO/GEO inspection
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug or false positive in `ultimate-seo-geo`.
  - type: input
    id: version
    attributes:
      label: Engine Version
      placeholder: e.g. 3.8.1
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target URL or Code Snippet
      description: URL or snippet where the issue was observed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Observed Behavior
      description: Explain the discrepancy and cite any relevant standards (RFC, Google, Schema.org)
    validations:
      required: true
